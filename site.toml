schema = 1
introduction = "Standards for the prose around a change: its commit messages, its description and its scope, so that a reviewer learns what changed and why."
scope = "pr-gnome judges what a change says about itself: its description, its commit messages, its scope, and the comments and docstrings it adds. Each policy says how one judgement is made, and each case shows the answer a correct judge gives."
outside_scope = "These standards judge what a change says about itself. Whether the code is correct, secure or tested is for other checks."

[resources]
glossary = "https://github.com/bugflow/bugflow/blob/master/docs/words.md"
guide = "https://github.com/bugflow/bugflow/blob/master/docs/gnomes.md"
adoption = "https://github.com/bugflow/bugflow/blob/master/docs/gnomes.md#after-a-change-is-merged"
format = "https://github.com/bugflow/bugflow/blob/master/docs/policy-package.md#a-case"

[sources]
readme = "README.md"
skill = "skills/pr-gnome-write/SKILL.md"

[example]
title = "Describe what the change does"
policy = "ED-01"
before = "seeded-01-marketing"
after = "clean-01-poller"
explanation = "The seeded case praises the poller. The clean case says what the poller does and how many tests passed. Each case's why line says what makes it clean or seeded."

[[checks]]
title = "Check prose for em dashes"
audience = "author"
policy = "ED-04"
command = "cd /path/to/your/work\n/path/to/pr-gnome/skills/pr-gnome-write/scripts/check-em-dash"
source = "skills/pr-gnome-write/scripts/check-em-dash"
purpose = "Reports each em dash in the Org and Markdown prose it is given, under ED-04. It runs no model policy."

[[checks]]
title = "Rebuild the skill references"
command = "make skills"
source = "Makefile"
purpose = "Writes the skill's copy of the doctrine and the policies under references/."

[[checks]]
title = "Validate a standards change"
command = "make check"
source = "Makefile"
purpose = "Runs the format tests, the cases of the checks and the comparison of the skill's copies with the root."
